name: Trigger Jenkins Pipeline

on:
  push:
    branches:
      - sampleForJenkins  # Replace with your branch name

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Output
        run: |
          echo "Jenkins URL: ${{ secrets.JENKINS_URL }}"
          echo "Jenkins User: ${{ secrets.JENKINS_USER }}"
          echo "Jenkins Token Length: $(echo -n ${{ secrets.JENKINS_TOKEN }} | wc -c)"

      - name: Test Jenkins Connection
        run: |
          curl -I -X GET ${{ secrets.JENKINS_URL }}
          curl -I -X POST ${{ secrets.JENKINS_URL }}/job/SampleTestAutomation/build \
          --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}"
